name = "team-handoff-notes"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "419923cdce967c667d26cdb9238fb5d8"

# Static frontend build output served by Workers Static Assets.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# D1 — metadata database (users, pages, attachments metadata, comments, etc.)
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "team_handoff_db"
database_id = "5877c774-412f-4d1f-9b98-7ed63d06926a"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# R2 — OPTIONAL private backup mirror of Google Drive originals.
# Commented out until R2 is enabled for this Cloudflare account (Dashboard →
# Storage & Databases → R2 → Enable — free tier, no purchase needed). Once
# enabled, run `wrangler r2 bucket create team-handoff-backup`, uncomment
# below, and set ENABLE_R2_BACKUP back to "true".
# ---------------------------------------------------------------------------
# [[r2_buckets]]
# binding = "BACKUP_BUCKET"
# bucket_name = "team-handoff-backup"

# ---------------------------------------------------------------------------
# Durable Object — single in-memory room broadcasting who is viewing which
# page and where their text cursor is, over WebSocket. No persistence: state
# only needs to live as long as people are connected.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceRoom"

[[migrations]]
tag = "v1"
new_classes = ["PresenceRoom"]

# ---------------------------------------------------------------------------
# Cron trigger for incremental Google Drive sync (default: every 15 minutes).
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/15 * * * *"]

# ---------------------------------------------------------------------------
# Non-secret configuration. Real secrets (private keys, client secret,
# refresh token, session secret) must be set with `wrangler secret put`,
# never written here or committed to git.
# ---------------------------------------------------------------------------
#
# GOOGLE_ALLOWED_EMAILS and GOOGLE_INITIAL_ADMIN_EMAILS are deliberately NOT
# here even though they aren't "secret" in the private-key sense — this repo
# is a public GitHub repo, so real teammates' email addresses would be
# world-readable if committed here. Set them with:
#   wrangler secret put GOOGLE_ALLOWED_EMAILS
#   wrangler secret put GOOGLE_INITIAL_ADMIN_EMAILS
# ---------------------------------------------------------------------------
[vars]
ENABLE_R2_BACKUP = "false"
MAX_UPLOAD_MB = "100"
DEMO_MODE = "true"
GOOGLE_DRIVE_FOLDER_ID = "1h8vtzWQLT2rl-6D3AOIxyhd4i3ZyVyKs"
GOOGLE_DRIVE_SHARED_DRIVE_ID = ""
GOOGLE_SERVICE_ACCOUNT_EMAIL = "wegoinn@gen-lang-client-0087622891.iam.gserviceaccount.com"
GOOGLE_OAUTH_CLIENT_ID = "224415624262-734b50u9oe8ie7tge704v14sn7mdouak.apps.googleusercontent.com"
OAUTH_REDIRECT_BASE_URL = "https://team-handoff-notes.wegoinnteam.workers.dev"

[env.preview]
[env.preview.vars]
DEMO_MODE = "true"

[env.production]
[env.production.vars]
DEMO_MODE = "false"
